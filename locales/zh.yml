    title: 正则表达式测试器 — 在线测试正则匹配
    description: 在线测试正则表达式 — JavaScript 语法，实时高亮匹配结果，可切换标志位与捕获组。

  safelink-decoder:
    title: Outlook 安全链接解码器
    description: 解码 Outlook 邮件里的 SafeLink 安全链接，还原真实地址。

  xml-to-json:
    title: XML 转 JSON
    description: 将 XML 数据转换为 JSON 格式。
  fullwidth-converter:
    title: "全角半角转换"
    description: "全角↔半角互转，支持整体转换或只转标点（Unicode 固定偏移 0xFEE0），适合中英混排的排版清理。"

  morse-code-converter:
    title: "摩斯电码转换"
    description: "文本与摩斯电码双向转换，字母用空格分隔、单词用 / 分隔，支持 A–Z、0–9 与常用标点。"

  rmb-uppercase:
    title: "人民币大写转换"
    description: "把金额数字转成财务用中文大写，遵循「元整 / 角 / 分」的规范写法，可加「人民币」前缀。"

  px-rem-converter:
    title: "px / rem 转换"
    description: "按根字号在 px 与 rem 之间批量换算，支持空格、逗号、换行分隔的多个数值。"

  text-replacer:
    title: "文本批量替换"
    description: "支持普通文本与正则表达式的批量替换，可忽略大小写，并给出替换次数统计。"

  json-to-get-params:
    title: "JSON / GET 参数互转"
    description: "JSON 转 URL 查询字符串（嵌套用 a[b][0] 形式）并可反向还原，支持直接粘贴完整 URL。"

  unit-converter:
    title: "单位换算"
    description: "长度、面积、体积、重量、速度、时间、数据存储、功率、压力、角度、温度共 11 类单位互转，含市斤、亩等中国单位。"

  json-to-code:
    title: "JSON 生成实体类"
    description: "由 JSON 生成 TypeScript、C#、Java、Go 实体类定义，嵌套对象自动拆成独立类。"
  whois-lookup:
    title: "WHOIS 查询"
    description: "查询域名的注册信息（注册商、注册/到期时间、域名状态），数据来自 RDAP —— WHOIS 的官方继任协议。"

  http-status-checker:
    title: "HTTP 状态码检测"
    description: "输入网址实时检测其 HTTP 状态码与响应头，用于排查站点可达性、跳转与缓存配置。"

  today-in-history:
    title: "历史上的今天"
    description: "查看今天在历史上发生过的事件，进入页面即自动加载，可随时重新加载。"

  htpasswd-generator:
    title: "htpasswd 生成与校验"
    description: "生成 Apache / Nginx Basic Auth 用的 .htpasswd 行，支持 bcrypt、apr1、SHA1 与明文，并可校验已有条目。"

  linux-commands:
    title: "Linux 命令速查"
    description: "常用 Linux 命令速查，含作用说明与可直接复用的示例，覆盖文件、文本处理、进程、网络等场景。"

  http-headers:
    title: "HTTP 头速查"
    description: "常见 HTTP 请求头与响应头速查，涵盖 CORS、缓存、安全相关字段及用途说明。"

  ascii-table:
    title: "ASCII 码表"
    description: "标准 ASCII 码表（0 至 127），同时给出十进制、十六进制、八进制、二进制与字符，支持搜索。"

