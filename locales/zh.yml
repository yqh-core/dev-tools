about:
  content: >
    # 关于 DigDevBox

    DigDevBox汇集了对开发人员和运维人员有用的在线工具，全部在浏览器本地运行，不上传任何数据。如果对您有帮助，欢迎收藏并分享给同事。

    本项目基于开源项目 [it-tools](https://github.com/CorentinTh/it-tools)（GPL-3.0 许可）二次开发，在此感谢原作者的贡献。当前版本由 DigDevBox 团队维护。

    ## 技术

    前端采用 Vue 3 + Naive UI，构建工具为 Vite，部署在 Cloudflare Pages。部分工具使用了第三方开源库。

    ## 发现问题？缺少工具？

    如果需要某个目前没有的工具，欢迎到 [DigDevBox 联系页](https://digdevbox.com/contact) 提交功能建议。

    如果发现 Bug 或某个功能表现异常，也请通过 [DigDevBox 联系页](https://digdevbox.com/contact) 提交问题报告。

    ## 同站工具

    - [IP 归属地查询](https://ip.digdevbox.com)
    - [房贷计算器](https://fangdai.digdevbox.com)

