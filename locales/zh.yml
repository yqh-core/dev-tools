    guide:
      title: "百分比公式与常见误区"
      intro: "先选择上方的计算任务并输入数值。结果说明会显示代入实际数值后的计算公式。"
      formulasTitle: "常用公式"
      formulas:
        percentOf: "求一个数值的百分之几：(百分比 ÷ 100) × 整体数值。示例：80 的 15% = 12。"
        partToWhole: "计算部分占整体的百分比：(部分 ÷ 整体) × 100。示例：30 占 120 的 25%。"
        percentageChange: "百分比变化：((新值 − 原始值) ÷ 原始值) × 100。示例：80 增至 92，变化为 +15%。"
        adjustment: "按百分比增加或减少：起始值 × (1 ± 比率 ÷ 100)。示例：80 减少 15% 后为 68。"
        reverse: "反向百分比：变化后数值 ÷ (1 ± 比率 ÷ 100)。示例：增加 20% 后为 120，增加前为 100。"
        percentageDifference: "对称百分比差异：|A − B| ÷ ((|A| + |B|) ÷ 2) × 100。示例：100 与 150 的差异为 40%。"
        percentagePoints: "百分点变化：新比率 − 旧比率。示例：4% 升至 6%，增加 2 个百分点；相对增长率为 50%。"
      distinctionsTitle: "区分不同的比较方式"
      changeVsDifference: "百分比变化具有方向性，以原始值作为基数。对称百分比差异不把任一数值作为基数，而是使用两个数值绝对值的平均值作为分母。"
      percentagePointsNote: "百分点衡量两个比率之间的绝对差值；相对百分比变化则用该差值除以旧比率。"
      edgeCasesTitle: "计算边界与连续调整"
      denominatorLimits: "整体数值或百分比变化的原始值为零时，对应计算没有定义。反向计算的调整乘数为零时无解；两个比较值都为零时，对称百分比差异没有定义。"
      sequentialAdjustments: "连续调整时，每一步都作用于上一步的中间值。100 先减少 20%，再减少 10%，最终为 72；总降幅是 28%，不是 30%。"
      displayPrecision: "结果最多显示 12 位有效数字。这是显示精度，不代表按货币最小单位舍入。"

