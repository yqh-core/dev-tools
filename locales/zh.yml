    description: 完整的正则表达式速查表 — 常用语法、量词、标志位与字符类，附示例，随查随用。

  regex-tester:
    title: 正则表达式测试器 — 在线测试正则匹配
    description: 在线测试 JavaScript 正则表达式，实时查看匹配、捕获组和替换预览，并用命名正向/反向测试用例查看逐项通过或失败结果。

  safelink-decoder:
    title: Outlook Safe Links 批量解码器 — 还原原始网址
    description: 批量解码 Microsoft Outlook Safe Links，每行一个包装链接，最多解开五层嵌套，并显示目标协议与主机；仅在浏览器本地解析，不进行安全扫描。
    batch:
      title: 批量解码 Outlook Safe Links
      intro: 每行粘贴一个 Microsoft Outlook Safe Links 地址，一次处理多条邮件链接。
      instructions: 空行会忽略；每条非空行独立解码并保留原始行号。复制时只包含成功提取的目标地址。
      placeholder: 每行粘贴一个 Outlook Safe Links 地址...
      decode: 开始批量解码
      copy: 复制成功结果
      summary: "已解码 {success}/{total} 条，失败 {failed} 条。"
      line: "第 {line} 行"
      success: 已提取目标地址（未进行安全检测）
      resultDetails: "目标地址：{scheme} · {host} · 包装层数 {depth}"
      copied: 已复制成功解码的地址。
      copyFailed: 无法访问剪贴板，请手动选择并复制解码结果。
    guide:
      title: 如何批量解码 Outlook Safe Links
      intro: 本工具只接受 Microsoft Outlook Safe Links 域名下的 HTTPS 包装链接，最多解开五层嵌套。所有操作只解析浏览器中的 URL 文本，不会请求或打开包装链接及目标网站。
      exampleTitle: 示例：一次处理两条链接
      example: |-
        第 1 行：https://nam01.safelinks.protection.outlook.com/?url=https%3A%2F%2Fexample.com%2Fdocs
        第 2 行：https://eur01.safelinks.protection.outlook.com/?url=https%3A%2F%2Fexample.org%2Faccount

        提取出的目标地址：
        https://example.com/docs
        https://example.org/account
      securityTitle: 重要的安全边界
      security1: 解码成功只表示提取出了嵌入的地址。协议、主机和包装层数仅描述 URL 结构，不代表域名信誉检查或安全结论。
      security2: 工具不会请求、打开、扫描或认证目标网站。决定访问前，请检查主机名、邮件上下文并遵循组织安全流程。
      security3: Microsoft Safe Links 仍可在点击时执行安全检查。本工具不会替代、关闭或绕过这项保护。
      relatedTitle: 继续检查目标地址
      urlParser: 使用 URL Parser 查看协议、主机、端口、路径、查询参数和片段。
      article: 阅读 Outlook Safe Links 指南
    single:
      title: 解码单条 Outlook Safe Links
      instructions: 只有一条链接时，可展开下方的单条解码器；批量解码仍是页面的主要工作流。
      placeholder: 粘贴一个 Outlook Safe Links 地址...
      inputLabel: Outlook Safe Links 地址
      outputLabel: 解码后的目标地址

  xml-to-json:
    title: XML 转 JSON
    description: 将 XML 数据转换为 JSON 格式。
  fullwidth-converter:
    title: "全角半角转换"
    description: "全角↔半角互转，支持整体转换或只转标点（Unicode 固定偏移 0xFEE0），适合中英混排的排版清理。"

  morse-code-converter:
    title: "摩斯电码转换器"
    description: "什么是摩斯电码？诞生于 19 世纪 40 年代的点划字母表。文本与摩斯电码双向转换——字母空格分隔、单词 / 分隔，免费即时，浏览器本地完成。"

  rmb-uppercase:
    title: "人民币大写转换"
    description: "把金额数字转成财务用中文大写，遵循「元整 / 角 / 分」的规范写法，可加「人民币」前缀。"

  px-rem-converter:
    title: "px / rem 转换"
    description: "按根字号在 px 与 rem 之间批量换算，支持空格、逗号、换行分隔的多个数值。"

  text-replacer:
    title: "文本批量替换"
    description: "支持普通文本与正则表达式的批量替换，可忽略大小写，并给出替换次数统计。"

  json-to-get-params:
    title: "JSON / GET 参数互转"
    description: "JSON 转 URL 查询字符串（嵌套用 a[b][0] 形式）并可反向还原，支持直接粘贴完整 URL。"

  unit-converter:
    title: "单位换算"
    description: "长度、面积、体积、重量、速度、时间、数据存储、功率、压力、角度、温度共 11 类单位互转，含市斤、亩等中国单位。"

  json-to-code:
