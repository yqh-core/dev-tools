    description: 把邮箱地址统一成标准格式，方便比对、去重和数据清洗。

  json-to-xml:
    title: JSON 转 XML
    description: 将 JSON 数据转换为 XML 格式。

  markdown-to-html:
    title: Markdown 转 HTML
    description: 把 Markdown 转换成 HTML，并支持打印（另存为 PDF）。

