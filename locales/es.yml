    description: "Encode text into Morse code and decode it back. Letters are separated by spaces and words by a slash."

  rmb-uppercase:
    title: "RMB amount in Chinese uppercase"
    description: "Turn a numeric amount into the Chinese financial uppercase wording (yuan / jiao / fen), optionally prefixed with 人民币."

  px-rem-converter:
    title: "px / rem converter"
    description: "Convert a batch of values between px and rem with a configurable root font size."

