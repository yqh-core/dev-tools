about:
  content: >
    # About DigDevBox

    DigDevBox is a collection of handy online tools for developers. Everything runs client-side in your browser - no data is ever uploaded. If you find it useful, feel free to bookmark and share it.

    This project is a fork of the open-source [it-tools](https://github.com/CorentinTh/it-tools) (GPL-3.0), and we are grateful to its author. It is currently maintained by the DigDevBox team.

    ## Technologies

    Built with Vue 3, Naive UI and Vite, deployed on Cloudflare Pages. Some tools rely on third-party open-source libraries.

    ## Found a bug? A tool is missing?

    Feature requests and bug reports are welcome at the [DigDevBox contact page](https://digdevbox.com/contact).

    ## Sibling tools

    - [IP Geolocation](https://ip.digdevbox.com)
    - [Mortgage Calculator](https://fangdai.digdevbox.com)

