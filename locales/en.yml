    description: Calculate an IPv4 subnet from an address and CIDR prefix. See the network and broadcast addresses, netmask, wildcard mask, subnet size and first/last host addresses.

  og-meta-generator:
    title: "Open Graph & Twitter Meta Tag Generator — Create Social Share Tags"
    description: "Generate copyable Open Graph and Twitter Card HTML meta tags for a page title, description, URL and social image. Choose website, article, book, profile, music or video metadata; no live share-card preview is included."

  ipv6-ula-generator:
    title: IPv6 ULA generator
    description: Generate your own local, non-routable IP addresses for your network according to RFC4193.

  hash-text:
    title: Hash Generator — MD5, SHA-1, SHA-256 Online
    description: 'Hash a text string using the function you need : MD5, SHA1, SHA256, SHA224, SHA512, SHA384, SHA3 or RIPEMD160 — with 16-digit MD5 and upper/lower-case hex output'

  json-to-toml:
    title: "JSON to TOML Converter"
    description: "Convert JSON or JSON5 objects to TOML. Nested objects become tables or dotted keys; arrays become TOML arrays. Unsupported values may prevent conversion."

  device-information:
    title: Device information
    description: Get information about your current device (screen size, pixel-ratio, user agent, ...)

  pdf-merge:
    title: PDF Merge — Combine PDF Files Online
    description: Combine two or more PDF files into one document in your browser. Files are merged in upload order, with page counts shown before you start; download the combined PDF.
    pickFiles: Choose PDF files
    selected: '{count} file selected | {count} files selected'
    working: Merging…
    button:
      merge: Merge PDFs
      download: Download merged.pdf
    errors:
      needTwo: Select at least two PDF files to merge.

  pdf-split:
    title: PDF Split — Split PDF Pages or Extract a Range
    description: Split a PDF into separate single-page files or extract a selected page range into a new PDF. Check the page count first; processing runs in your browser.
    pickFile: Choose a PDF file
    pageCount: 'This document has {count} page. | This document has {count} pages.'
    working: Splitting…
    mode:
      label: Split mode
      each: One PDF per page
      range: Extract a page range
    from: From page
    to: To page
    button:
      split: Split PDF

  pdf-watermark:
    title: PDF Watermark — Add Text Watermarks to PDF
    description: Add a text watermark to every page of a PDF. Adjust font size, opacity and angle, then choose a single centered line or a tiled layout; processing stays in your browser.
    pickFile: Choose a PDF file
    text: Watermark text
    textPlaceholder: e.g. CONFIDENTIAL
    fontSize: Font size
    opacity: Opacity
    angle: Angle
    tile: Tile across page
    working: Applying…
    button:
      apply: Apply watermark
      download: Download watermarked.pdf
    errors:
      needText: Enter the watermark text first.

  pdf-compress:
    title: PDF Compressor — Reduce PDF File Size Online
    description: Compress a PDF by recompressing embedded photos and rebuilding file structure. Compare before-and-after sizes with balanced or strong compression; text and vector content stay untouched, and the result is never larger than the original.
    pickFile: Choose a PDF file
    levelLabel: Compression level
    balanced: Balanced (recommended)
    strong: Strong
    balancedHint: Recompresses embedded photos at screen quality with a ~1800px cap — good for everyday sharing and archiving.
    strongHint: Pushes photos to ~1200px at visibly lower quality — best for scans and camera shots that must fit an email limit.
    working: Compressing…
    button:
      compress: Compress PDF
      download: Download compressed.pdf
    result:
      from: 'Before: '
      to: 'After: '
      saved: 'Saved: '
    optimalNote: This PDF is already close to optimal — mostly text and vectors, with little left to squeeze. The output is your original file; the tool never returns something bigger.
    errors:
      tooLarge: File exceeds 80 MB — browser-side processing would be unreliable. Please use a desktop tool.

  image-crop:
    title: Image Cropper — Crop Photos to Any Aspect Ratio
    description: Crop an image to an exact pixel region online. Choose a preset aspect ratio or freeform selection, then export at the selected dimensions in a supported image format.
    pickFile: Choose an image
    ratio: Aspect ratio
    ratioFree: Free
    ratioOriginal: Original
    selection: Selection
    format: Output format
    quality: 'Quality: {q}'
    button: Crop image
    buttonDownload: Download cropped image
  image-color-picker:
    title: Image Color Picker — Get HEX, RGB & HSL from Any Image
    description: "Pick a pixel in an image to read its stored HEX, RGB and HSL values. Sampling uses the original image bitmap locally in your browser; transparent pixels report stored RGB values without alpha compositing."
    pickFile: Choose an image
    clickHint: Click a pixel to sample it.
  favicon-generator:
    title: Favicon Generator — Create ICO & PNG Icons
    description: Create a multi-size favicon.ico, Apple touch icon and PNG app icons from an image. Choose a transparent or white background; image processing runs in your browser.
    pickFile: Choose an image
    background: Background
    bgTransparent: Keep transparency
    bgWhite: Fill white
    working: Generating…
    button: Generate icons
    downloadIco: Download favicon.ico
    download: Download
    htmlSnippet: HTML to paste
    copySnippet: Copy HTML
  image-to-pdf:
    title: Images to PDF Converter — Combine JPG & PNG Online
    description: Combine multiple images into one PDF, with each image placed on its own page. Add images, review the selection and create a downloadable PDF in your browser.
    pickFile: Choose images
    selected: '{count} image selected | {count} images selected'
    margin: Page margin (pt)
    working: Building…
    button: Create PDF
    buttonDownload: Download PDF
    pagesSuffix: '{count} page | {count} pages'
    errors:
      unreadable: This file could not be decoded as an image

  image-resize:
    title: Image Resizer — Resize Images to Exact Dimensions
    description: Resize an image to exact pixel width and height, with an optional aspect-ratio lock. Export PNG, JPEG or WebP when your browser supports the format; processing happens locally.
    pickFile: Choose an image
    width: Target width (px)
    height: Target height (px)
    lockAspect: Keep aspect ratio
    format: Output format
    quality: 'Quality: {q}'
    working: Resizing…
    button: Resize image
    vsSource: vs source
    previewAlt: Resized image preview
    buttonDownload: Download resized image
  image-compress:
    title: Image Compressor — Reduce JPEG & WebP File Size
    description: Compress JPEG and WebP images in your browser. Adjust output quality or set a target file size in KB; compression is lossy, and the target may be unreachable for some images.
    pickFile: Choose an image
    format: Output format
    quality: 'Quality: {q}'
    targetSize: Target size in KB (optional)
    targetSizePlaceholder: e.g. 200
    working: Compressing…
    button: Compress image
    usedQuality: quality used
    buttonDownload: Download compressed image
    errors:
      targetUnreachable: Even the lowest quality could not reach that size. Raise the target, or resize the image first.

  pdf-signature-checker:
    title: "PDF Signature Checker — Verify PDF Signatures & Certificates"
    description: "Inspect supported PDF digital signatures, check signed-byte integrity and certificate trust or expiry, and distinguish unsupported or unreadable files. These are technical checks, not legal certification."

  json-minify:
    title: JSON minify
    description: Minify and compress your JSON by removing unnecessary whitespace.

  nanoid-generator:
    title: Nano ID Generator — Short, URL-safe Unique IDs Online
    description: Generate nanoid-style unique IDs online — URL-safe alphabet, any length, batch of up to 200, built with crypto randomness in your browser.
  color-contrast-checker:
    title: Color Contrast Checker — Pass or Fail WCAG AA and AAA
    description: Check the contrast ratio between two colours against WCAG 2.x AA and AAA thresholds for normal and large text, with a live text preview.

  ulid-generator:
    title: ULID Generator — Time-Ordered, Sortable IDs Online
    description: Generate ULIDs online — sortable, time-ordered unique identifiers, ideal for database keys and distributed systems.

  string-obfuscator:
    title: String obfuscator
    description: Obfuscate a string (like a secret, an IBAN, or a token) to make it shareable and identifiable without revealing its content.

  base-converter:
    title: "Number Base Converter — Bases 2–64"
    description: "Convert non-negative integers between bases 2–64, including binary, octal, decimal, hexadecimal and custom alphabets. This converts numbers, not text."

  yaml-to-json-converter:
    title: YAML to JSON Converter — Convert YAML Online
    description: "Convert YAML configuration data into JSON in your browser. Nested mappings become objects, sequences become arrays, and YAML scalar types are reflected in the JSON output; comments are not preserved."

  uuid-generator:
    title: UUID Generator — v4, v1, v3, v5 and NIL IDs
    description: Generate UUIDs online for free — v4 random, v1 time-based, v3/v5 namespace UUIDs and NIL, with one-click copy.

  ipv4-address-converter:
    title: IPv4 address converter
    description: Convert an IP address into decimal, binary, hexadecimal, or even an IPv6 representation of it.

  text-statistics:
    title: "Text Statistics — Word & Character Counter"
    description: "Free online word and character counter with Unicode grapheme, code point, UTF-16 and UTF-8 byte counts. Count words, unique words, sentences, paragraphs and lines, estimate reading time, and keep text private in your browser."

  text-to-nato-alphabet:
    title: Text to NATO alphabet
    description: Transform text into the NATO phonetic alphabet for oral transmission.

  basic-auth-generator:
    title: "Basic Auth Generator & Decoder — HTTP Header"
    description: "Generate or decode an HTTP Basic Authorization header in your browser. Copy the Base64 token for cURL; Base64 is not encryption, so use HTTPS."

  text-to-unicode:
    title: "Text to Unicode Converter — Decimal HTML References & Code Points"
    description: "Convert text to decimal HTML numeric character references and back, or convert text to decimal Unicode code-point lists. HTML-reference mode uses UTF-16 code units and does not support hexadecimal entities or \\u escapes."

  ipv4-range-expander:
    title: IP Range to CIDR Converter — Convert IPv4 Ranges Online
    description: Convert a start and end IPv4 address into the smallest set of CIDR blocks that covers the full range. Useful for firewall rules, cloud security groups and routing tables.

  text-diff:
    title: Text Diff Checker — Compare Two Texts Side by Side
    description: Compare two text inputs in a side-by-side diff editor to spot additions, deletions and changed lines.

  otp-generator:
    title: "TOTP Code Generator — 6-Digit Codes & QR"
    description: "Generate current, previous and next 6-digit TOTP codes from a Base32 secret, view the 30-second timer, and create an otpauth QR code. Uses Web Crypto."

  url-encoder:
    title: URL Encoder & Decoder — Percent-Encoding, encodeURIComponent Pitfalls
    description: Encode text to URL-encoded format (also known as "percent-encoded"), or decode from it.

  text-to-binary:
    title: "Text to Binary Converter — ASCII 8-Bit Encoder & Decoder"
    description: "Convert basic ASCII text to 8-bit binary groups and decode byte-aligned ASCII binary back to text. This is not a Unicode or UTF-8 byte encoder."

  ascii-text-drawer:
    title: ASCII Art Generator
    description: Turn text into ASCII art with multiple fonts and styles.

  email-normalizer:
    title: Email Address Normalizer
    description: Normalize email addresses to a standard format for easier comparison, deduplication and data cleaning.

  json-to-xml:
    title: JSON to XML
    description: Convert JSON data to XML format.

  markdown-to-html:
    title: Markdown to HTML Converter — Live Preview & HTML Output
    description: Convert Markdown to HTML with a live preview in your browser. Copy the generated HTML or use the print dialog to save the rendered result as a PDF.

  regex-memo:
    title: Regex Cheat Sheet — Complete Regular Expression Reference
    description: A complete regex cheat sheet — common regular expression syntax, quantifiers, flags and character classes with examples.

  regex-tester:
    title: Regular Expression Tester — JavaScript Regex
    description: Test JavaScript regular expressions online with live matches, capture groups, replacement preview and named positive/negative test cases with pass/fail results. A 300ms worker timeout stops runaway patterns.

  safelink-decoder:
    title: "Outlook Safe Links Decoder — Reveal the Original URL"
    description: "Decode Outlook Safe Links URLs, including nested wrappers, to reveal the final HTTP or HTTPS destination without opening it. Runs in your browser; decoding does not scan or verify the destination."

  xml-to-json:
    title: XML to JSON Converter — Convert XML Online
    description: Convert XML into JSON in your browser. Elements become objects, repeated elements become arrays, and attributes and text are represented with separate keys.

  fullwidth-converter:
    title: "Full-width / half-width converter"
    description: "Convert between full-width and half-width characters using the fixed Unicode offset 0xFEE0, or adjust punctuation only."

  morse-code-converter:
    title: "Morse Code Translator — Encode Text & Decode Morse"
    description: "Translate text to Morse code or decode dot-and-dash sequences. Supports A–Z, digits and common punctuation; letters are separated by spaces and words by slashes."

  rmb-uppercase:
    title: "RMB amount in Chinese uppercase"
    description: "Turn a numeric amount into the Chinese financial uppercase wording (yuan / jiao / fen), with an optional RMB prefix."

  px-rem-converter:
    title: "PX to REM Converter — Batch Conversion with Root Font Size"
    description: "Convert batches of CSS pixel and rem values in either direction. Set the root font size and decimal precision; values can be separated by spaces, commas or newlines."

  text-replacer:
    title: "Find and Replace Text — Plain Text & Regex Replacer"
    description: "Paste text, find a phrase or regular expression, replace or remove matches, ignore case and see the replacement count and output length."

  json-to-get-params:
    title: "JSON to Query String Converter"
    description: "Percent-encode nested JSON as URL query parameters, or rebuild JSON from a query string or full URL. Supports bracketed object keys and indexed arrays."

  unit-converter:
    title: "Unit converter"
    description: "Convert between 11 categories of units: length, area, volume, weight, speed, time, data storage, power, pressure, angle and temperature."

  json-to-code:
    title: "JSON to model classes"
    description: "Generate TypeScript, C#, Java or Go model classes from JSON, splitting nested objects into their own classes."
  whois-lookup:
    title: "Domain WHOIS & RDAP Lookup — Check Registration Details"
    description: "Look up domain registration data through RDAP, including registrar, registration and expiry dates, status and nameservers when supplied by the registry. Coverage and returned fields vary by domain extension."

  http-status-checker:
    title: "HTTP status checker"
    description: "Check the live HTTP status code and response headers of a URL to troubleshoot reachability, redirects and caching."

  today-in-history:
    title: "Today in history"
    description: "See what happened on this day in history. Events load automatically when the page opens."

  htpasswd-generator:
    title: "htpasswd Generator & Checker — bcrypt & apr1"
    description: "Build multi-user Apache/Nginx .htpasswd files with bcrypt or apr1. Copy, download or verify a username:hash line locally. Passwords stay in your browser."

  linux-commands:
    title: "Linux commands cheat sheet"
    description: "A searchable cheat sheet of common Linux commands with what they do and ready-to-use examples."

  http-headers:
    title: "HTTP Header Analyzer — Paste Headers, Get a Security Score"
    description: "Paste response headers from curl or DevTools for local CSP, HSTS, cookie, CORS, caching and indexing checks. Get a transparent coverage score; nothing is uploaded."
  ascii-table:
    title: "ASCII table"
    description: "The standard ASCII table from 0 to 127 with decimal, hexadecimal, octal and binary values, searchable by character or code."

