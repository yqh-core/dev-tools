about:
  content: >
    # About 开发者工具箱

    开发者工具箱 is a collection of handy online tools for developers. Everything runs client-side in your browser - no data is ever uploaded. If you find it useful, feel free to bookmark and share it.

    This project is a fork of the open-source [it-tools](https://github.com/CorentinTh/it-tools) (GPL-3.0), and we are grateful to its author. It is currently maintained by [yqh-core](https://github.com/yqh-core) and the source lives at [https://github.com/yqh-core/dev-tools](https://github.com/yqh-core/dev-tools).

    ## Technologies

    Built with Vue 3, Naive UI and Vite, deployed on Cloudflare Pages. Some tools rely on third-party open-source libraries - see the [package.json](https://github.com/yqh-core/dev-tools/blob/main/package.json) in the repository for the full list.

    ## Found a bug? A tool is missing?

    Feature requests and bug reports are welcome at [https://github.com/yqh-core/dev-tools/issues](https://github.com/yqh-core/dev-tools/issues/new/choose).

    ## Sibling tools

    - [IP Geolocation](https://ip.digdevbox.com)
    - [Mortgage Calculator](https://fangdai.digdevbox.com)

