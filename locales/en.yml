about:
  content: |-
    # About DigDevBox

    DigDevBox is a collection of small browser tools: {count} developer and everyday utilities at this address, plus a classic archive under `/legacy/` kept from the older Chinese version of the site.

    ## What we commit to

    1. **Everything runs in your browser.** Text, files, keys and passwords are processed locally and are
       never uploaded or stored — the three tools that must ask someone else are named right below.
    2. **We collect nothing about you.** No account, no sign-in, no paywall, and no feature kept behind one.
    3. **Free to use, and ads never touch a result.** Pages carry Google AdSense; the ad code has no input
       into any calculation, and no tool's output changes because you did or did not click an ad.
    4. **Every tool documents itself.** Each page ships its own instructions and a worked example. If
       something is wrong, [tell us](/contact/) — corrections are how this site gets better.

    ## Where your data goes

    Every tool does its work in your browser. The text, files, keys and passwords you paste are processed locally — they are not uploaded and not stored.

    Three tools are the exception, because they cannot answer without asking someone else:

    - [WHOIS lookup](/whois-lookup/) queries the domain registry
    - [HTTP status checker](/http-status-checker/) requests the URL you enter
    - [Today in history](/today-in-history/) reads a public dataset

    Those send the value you typed to a third-party service in order to produce a result. Everything else stays on your machine.

    There is no account, no sign-up, no paywall, and no server-side copy of what you are working on.

    ## Who runs it

    DigDevBox is maintained by one person, not a company or a team. The site is funded by advertising; what that means for cookies and personalised ads is spelled out in the [Privacy Policy](/privacy/).

    ## Where the code comes from

    This project is a fork of the open-source [it-tools](https://github.com/CorentinTh/it-tools) (GPL-3.0), and the credit for its architecture belongs to the original author. Built with Vue 3, Naive UI and Vite, deployed as static files on Cloudflare Pages. Some tools rely on third-party open-source libraries.

    ## A note on accuracy

    Each tool page documents what that tool actually does, read from the code rather than from what a similar-looking tool would do. If a page ever claims a capability the tool does not have — a format it cannot convert, an option that is not there — that is a bug, not marketing. Please report it and it gets fixed.

    ## Feedback, bugs, missing tools

    Feature requests and bug reports are welcome on the [contact page](/contact/).

    ## Sibling tools

    - [IP Geolocation](https://ip.digdevbox.com) — where an IP address resolves to
    - [Mortgage Calculator](https://fangdai.digdevbox.com) — monthly payments and total interest
    - [Drawing](https://draw.digdevbox.com) — browser image editor
    - [DigImg](https://img.digdevbox.com) — AVIF / WebP / JPEG XL compression in the browser
    - [M3U8 Player](https://play.digdevbox.com) — stream playback in the browser
    - [TTS Reader](https://ttsreader.digdevbox.com) — turn text into speech
    - [Forge Notes](https://notes.digdevbox.com) — longer guides on tooling and performance
