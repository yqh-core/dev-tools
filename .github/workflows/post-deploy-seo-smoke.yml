name: Post-deploy SEO smoke

on:
  workflow_run:
    workflows: ["verify"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  detect-site-changes:
    runs-on: ubuntu-latest
    outputs:
      wait_for_deploy: ${{ steps.detect.outputs.wait_for_deploy }}
      deploy_sha: ${{ steps.detect.outputs.deploy_sha }}
      check_eta_release: ${{ steps.detect.outputs.check_eta_release }}
    steps:
      - name: Detect whether this exact commit changes deployable site files
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            // Allow an operator to re-run the production smoke against the live site
            // after updating its assertions, without requiring a dummy product commit.
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('deploy_sha', context.sha);
              core.setOutput('wait_for_deploy', 'false');
              core.setOutput('check_eta_release', 'true');
              core.info('Manual production smoke: validate the currently served release markers.');
              return;
            }
            if (context.payload.workflow_run.conclusion !== 'success') {
              core.info('Source verify did not succeed; production smoke will exit without checking deployment.');
              core.setOutput('deploy_sha', context.payload.workflow_run.head_sha);
              core.setOutput('wait_for_deploy', 'false');
              core.setOutput('check_eta_release', 'false');
              return;
            }
            let cursor = context.payload.workflow_run.head_sha;
            let deploySha = cursor;
            let waitForDeploy = false;
            let checkEtaRelease = false;
            // A workflow-only follow-up commit must still wait for the latest
            // ancestor that actually changed the deployed site (e.g. locale files).
            for (let depth = 0; depth < 20 && cursor; depth++) {
              const { data } = await github.rest.repos.getCommit({ owner, repo, ref: cursor });
              const files = data.files || [];
              const deployable = files.filter(({ filename }) =>
                !filename.startsWith('.github/') &&
                !['README.md', 'CONTRIBUTING.md'].includes(filename)
              );
              core.info('Inspecting commit ' + cursor + ': ' + files.map(file => file.filename).join(', '));
              if (deployable.length) {
                deploySha = cursor;
                waitForDeploy = true;
                checkEtaRelease = deployable.some(({ filename }) => filename.startsWith('src/tools/eta-calculator/'));
                core.info('Latest deployable site commit: ' + deploySha);
                break;
              }
              cursor = data.parents?.[0]?.sha || '';
            }
            core.setOutput('deploy_sha', deploySha);
            core.setOutput('wait_for_deploy', waitForDeploy ? 'true' : 'false');
            core.setOutput('check_eta_release', checkEtaRelease ? 'true' : 'false');

  production-smoke:
    needs: detect-site-changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for Cloudflare Git deployment and verify crawler-facing pages
        env:
          SITE_ORIGIN: "https://www.digdevbox.com"
          EXPECTED_TITLE: "Free Online Developer Tools"
          TARGET_SHA: ${{ needs.detect-site-changes.outputs.deploy_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          WAIT_FOR_DEPLOY: ${{ needs.detect-site-changes.outputs.wait_for_deploy }}
          CHECK_ETA_RELEASE: ${{ needs.detect-site-changes.outputs.check_eta_release }}
          SOURCE_CONCLUSION: ${{ github.event_name == 'workflow_dispatch' && 'success' || github.event.workflow_run.conclusion }}
        run: |
          node --input-type=module <<'NODE'
          if (process.env.SOURCE_CONCLUSION !== 'success') {
            console.log('Source verify did not succeed; skipping production SEO smoke.');
            process.exit(0);
          }
          const origin = process.env.SITE_ORIGIN;
          const expectedTitle = process.env.EXPECTED_TITLE;
          const ua = 'Googlebot/2.1 (+http://www.google.com/bot.html)';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          // Wait for the Cloudflare Pages check belonging to this exact source commit.
          const targetSha = process.env.TARGET_SHA;
          const checksUrl = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY +
            '/commits/' + targetSha + '/check-runs';
          let cloudflareReady = process.env.WAIT_FOR_DEPLOY !== 'true';
          if (cloudflareReady) {
            console.log('No deployable site files changed; validating current production without waiting for a new Cloudflare build');
          }
          for (let attempt = 1; !cloudflareReady && attempt <= 90; attempt++) {
            const response = await fetch(checksUrl, {
              headers: {
                authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
                accept: 'application/vnd.github+json',
                'x-github-api-version': '2022-11-28',
              },
              signal: AbortSignal.timeout(10000),
            });
            if (!response.ok) throw new Error('GitHub check-run API returned HTTP ' + response.status);
            const payload = await response.json();
            const check = (payload.check_runs || []).find((item) =>
              item.name === 'Cloudflare Pages' && item.head_sha === targetSha
            );
            if (check?.status === 'completed' && check.conclusion === 'success') {
              cloudflareReady = true;
              console.log('Cloudflare Pages deployment succeeded for exact commit ' + targetSha);
              break;
            }

            // GitHub's Cloudflare status can lag the edge rollout. The exact
            // production SEO marker is a stronger fallback: it proves the new
            // deployable commit is already serving the approved metadata.
            const [percentageResponse, htpasswdResponse, safeLinksResponse, etaResponse] = await Promise.all([
              fetch(origin + '/percentage-calculator/', {
                redirect: 'follow',
                headers: { 'user-agent': ua, 'cache-control': 'no-cache' },
                signal: AbortSignal.timeout(10000),
              }),
              fetch(origin + '/htpasswd-generator/', {
                redirect: 'follow',
                headers: { 'user-agent': ua, 'cache-control': 'no-cache' },
                signal: AbortSignal.timeout(10000),
              }),
              fetch(origin + '/safelink-decoder/', {
                redirect: 'follow',
                headers: { 'user-agent': ua, 'cache-control': 'no-cache' },
                signal: AbortSignal.timeout(10000),
              }),
              fetch(origin + '/eta-calculator/', {
                redirect: 'follow',
                headers: { 'user-agent': ua, 'cache-control': 'no-cache' },
                signal: AbortSignal.timeout(10000),
              }),
            ]);
            const [percentageHtml, htpasswdHtml, safeLinksHtml, etaHtml] = await Promise.all([
              percentageResponse.text(),
              htpasswdResponse.text(),
              safeLinksResponse.text(),
              etaResponse.text(),
            ]);
            const percentageMarkerReady = percentageResponse.ok &&
              percentageResponse.url === origin + '/percentage-calculator/' &&
              percentageHtml.includes('<title>Percentage Calculator — Percent of, Change & Difference - DigDevBox</title>') &&
              percentageHtml.includes('content="Calculate percentages, discounts, percentage change, reverse percentages and percentage points. Seven modes plus batch CSV/TSV export and worked formulas."') &&
              percentageHtml.includes('Can I calculate a list of percentage problems at once?') &&
              percentageHtml.includes('Sequential percentage adjustments') &&
              percentageHtml.includes('28% off overall, not 30%') &&
              percentageHtml.includes('Batch mode uses two numeric columns per row') &&
              percentageHtml.includes('href="' + origin + '/percentage-calculator/"');
            const htpasswdMarkerReady = htpasswdResponse.ok &&
              htpasswdResponse.url === origin + '/htpasswd-generator/' &&
              htpasswdHtml.includes('content="Build multi-user Apache/Nginx .htpasswd files with bcrypt or apr1. Copy, download or verify a username:hash line locally. Passwords stay in your browser."') &&
              htpasswdHtml.includes('Build a complete .htpasswd file with one line per user for Apache or Nginx Basic Auth') &&
              htpasswdHtml.includes('href="' + origin + '/htpasswd-generator/"');
            const safeLinksMarkerReady = safeLinksResponse.ok &&
              safeLinksResponse.url === origin + '/safelink-decoder/' &&
              safeLinksHtml.includes('<title>Outlook Safe Links Batch Decoder — Reveal Original URLs - DigDevBox</title>') &&
              safeLinksHtml.includes('content="Batch-decode Microsoft Outlook Safe Links one wrapper per line. Unwrap up to five layers, inspect destination scheme and host, and copy valid URLs; local parsing only, no safety scan."') &&
              safeLinksHtml.includes('Outlook Safe Links Batch Decoder') &&
              safeLinksHtml.includes('one wrapper per line') &&
              safeLinksHtml.includes('href="' + origin + '/safelink-decoder/"');
            const etaMarkerReady = process.env.CHECK_ETA_RELEASE !== 'true' || (
              etaResponse.ok &&
              etaResponse.url === origin + '/eta-calculator/' &&
              etaHtml.includes('<title>ETA Calculator — Task Completion Time - DigDevBox</title>') &&
              etaHtml.includes('Estimate time remaining for a download, build or batch job with an optional weekday work schedule, or derive throughput from completed work and elapsed time.') &&
              etaHtml.includes('Calculate from elapsed time') &&
              etaHtml.includes('href="' + origin + '/eta-calculator/"')
            );
            const productionMarkerReady = percentageMarkerReady && htpasswdMarkerReady && safeLinksMarkerReady && etaMarkerReady;
            if (productionMarkerReady) {
              cloudflareReady = true;
              console.log('Production SEO marker confirms the exact release is serving, despite a pending/stale Cloudflare check');
              break;
            }
            if (check?.status === 'completed' && check.conclusion !== 'success') {
              throw new Error('Cloudflare Pages deployment concluded ' + check.conclusion +
                ' and the production marker is not live: ' + (check.details_url || 'no details URL'));
            }
            console.log('Waiting for exact Cloudflare deployment (' + attempt + '/90): ' +
              (check?.status || 'check not created') + '; production marker not live yet');
            await sleep(10000);
          }
          if (!cloudflareReady) throw new Error('Exact Cloudflare Pages deployment did not complete within 15 minutes');

          async function get(path, userAgent = ua) {
            const response = await fetch(origin + path, {
              redirect: 'follow',
              headers: { 'user-agent': userAgent, 'cache-control': 'no-cache' },
            });
            return { response, body: await response.text(), finalUrl: response.url, redirected: response.redirected };
          }

          let home = null;
          for (let attempt = 1; attempt <= 20; attempt++) {
            try {
              const result = await get('/');
              if (result.response.ok && result.body.includes(expectedTitle) && result.body.includes('rel="canonical"')) {
                home = result;
                console.log(`Production homepage ready (attempt ${attempt})`);
                break;
              }
              console.log(`Waiting for deployment (${attempt}/20): HTTP ${result.response.status}`);
            } catch (error) {
              console.log(`Waiting for origin (${attempt}/20): ${error.message}`);
            }
            await sleep(15000);
          }
          if (!home) throw new Error('Production homepage did not expose expected SEO HTML within 5 minutes');

          // Verify the browser-visible final URL, not only the HTML canonical tag.
          // A canonical URL that itself redirects is a conflicting indexing signal.
          if (home.finalUrl !== origin + '/') {
            throw new Error('Homepage final URL conflicts with canonical origin: requested ' +
              origin + '/ but ended at ' + home.finalUrl);
          }
          for (const [label, url] of [
            ['apex HTTPS', 'https://digdevbox.com/'],
            ['www HTTPS', 'https://www.digdevbox.com/'],
            ['apex HTTP', 'http://digdevbox.com/'],
          ]) {
            const result = await fetch(url, {
              redirect: 'follow',
              headers: { 'user-agent': ua, 'cache-control': 'no-cache' },
            });
            if (!result.ok || result.url !== origin + '/') {
              throw new Error(label + ' does not converge to ' + origin + '/ (HTTP ' +
                result.status + ', final ' + result.url + ')');
            }
          }

          // Search Console has exposed both slashless and slash URLs for several
          // priority tools. Require every variant to converge to the one sitemap URL.
          for (const route of [
            '/percentage-calculator',
            '/regex-tester',
            '/numeronym-generator',
            '/token-generator',
            '/device-information',
            '/ipv4-range-expander',
            '/pdf-signature-checker',
          
            '/api-debugger',
            '/json-prettify',
            '/json-workspace',
            '/base-converter',
            '/html-entities',
            '/json-to-get-params',
            '/docker-run-to-docker-compose-converter',
            '/otp-generator',
            '/htpasswd-generator',
            '/json-to-toml',
            '/text-statistics',
            '/json-diff',
            '/slugify-string',
            '/redirect-generator',
            '/eta-calculator',]) {
            const expected = origin + route + '/';
            for (const variant of [route, route + '/']) {
              const result = await get(variant);
              if (!result.response.ok || result.finalUrl !== expected) {
                throw new Error(variant + ' does not converge to ' + expected + ' (HTTP ' +
                  result.response.status + ', final ' + result.finalUrl + ')');
              }
            }
          }

          const canonical = home.body.includes('href="' + origin + '/"');
          if (!canonical) throw new Error('Homepage canonical does not match the selected production origin');
          const productLinks = [
            'https://img.digdevbox.com/',
            'https://ip.digdevbox.com/',
            'https://play.digdevbox.com/',
            'https://draw.digdevbox.com/',
            'https://ttsreader.digdevbox.com/',
            'https://notes.digdevbox.com/',
          ];
          const missingProductLinks = productLinks.filter((url) => !home.body.includes(url));
          if (missingProductLinks.length) throw new Error('Main-site product discovery links missing: ' + missingProductLinks.join(', '));
          if (/href=["']https:\/\/(?:fangdai|geek-typing)\.digdevbox\.com\//i.test(home.body)) {
            throw new Error('Deferred China-only product link remains in the English main site');
          }
          if (home.body.includes('href="https://digdevbox.com/')) throw new Error('Stale bare-domain internal link remains on the main site');

          // The shared SEO article template is rendered on every tool landing page.
          // Check a representative page so retired China-only products cannot leak back
          // into the crawlable tool directory through the reusable template.
          const toolLanding = await get('/api-debugger/');
          if (!toolLanding.response.ok || !toolLanding.body.includes('rel="canonical"')) {
            throw new Error('REST API Tester landing page is not crawlable: HTTP ' + toolLanding.response.status);
          }
          if (/href=["']https:\/\/(?:fangdai|geek-typing)\.digdevbox\.com\//i.test(toolLanding.body)) {
            throw new Error('Deferred China-only product link remains in a tool landing page');
          }
          for (const url of [
            'https://img.digdevbox.com/',
            'https://ip.digdevbox.com/',
            'https://play.digdevbox.com/',
            'https://draw.digdevbox.com/',
            'https://ttsreader.digdevbox.com/',
            'https://notes.digdevbox.com/',
          ]) {
            if (!toolLanding.body.includes(url)) throw new Error('Tool landing page missing product network link: ' + url);
          }

          // Compare Googlebot's raw HTML with a normal browser request on the two
          // priority English pages. This catches UA-dependent HTML/cache variants
          // and guarantees the crawler sees the same title, description, H1 and canonical.
          const browserUa = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36';
          const priorityPages = ['/', '/safelink-decoder/', '/percentage-calculator/', '/http-headers/', '/eta-calculator/', '/ipv6-ula-generator/', '/numeronym-generator/', '/api-debugger/', '/regex-tester/', '/json-prettify/', '/json-workspace/', '/json-diff/', '/base-converter/', '/html-entities/', '/json-to-get-params/', '/docker-run-to-docker-compose-converter/', '/otp-generator/', '/htpasswd-generator/', '/json-to-toml/', '/text-statistics/', '/slugify-string/', '/redirect-generator/', '/uuid-generator/', '/ipv4-subnet-calculator/', '/xml-formatter/', '/json-to-xml/', '/basic-auth-generator/', '/privacy/', '/guides/hash-text/', '/guides/rmb-uppercase/', '/guides/numeronym-generator/', '/guides/git-memo/'];
          for (const path of priorityPages) {
            const [bot, browser] = await Promise.all([get(path), get(path, browserUa)]);
            for (const [label, result] of [['Googlebot', bot], ['browser', browser]]) {
              if (!result.response.ok || result.finalUrl !== origin + path) {
                throw new Error(path + ' ' + label + ' request did not resolve to the canonical URL (HTTP ' +
                  result.response.status + ', final ' + result.finalUrl + ')');
              }
            }
            const decodeHtmlEntities = (value) => {
              const named = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", nbsp: '\u00a0' };
              const decodePoint = (entity, point) =>
                Number.isInteger(point) && point >= 0 && point <= 0x10ffff
                  ? String.fromCodePoint(point)
                  : entity;
              return value
                .replace(/&#x([\da-f]+);/gi, (entity, hex) => decodePoint(entity, Number.parseInt(hex, 16)))
                .replace(/&#(\d+);/g, (entity, decimal) => decodePoint(entity, Number(decimal)))
                .replace(/&([a-z]+);/gi, (entity, name) => named[name.toLowerCase()] ?? entity);
            };
            const extract = (html) => ({
              title: html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1]?.trim() || '',
              description: html.match(/<meta[^>]+name=["']description["'][^>]+content=["']([^"']*)["']/i)?.[1] || '',
              canonical: html.match(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)["']/i)?.[1] || '',
              h1: decodeHtmlEntities(html.match(/<h1\b[^>]*>([\s\S]*?)<\/h1>/i)?.[1]?.replace(/<[^>]+>/g, '').trim() || ''),
              mainLandmarks: (html.match(/<main(?:\s|>)/gi) || []).length,
            });
            const botMeta = extract(bot.body);
            const browserMeta = extract(browser.body);
            if (!botMeta.title || !botMeta.description || !botMeta.h1 || botMeta.canonical !== origin + path || botMeta.mainLandmarks !== 1) {
              throw new Error(path + ' Googlebot HTML is missing title, description, H1, one main landmark or self-canonical metadata: ' + JSON.stringify(botMeta));
            }
            if (JSON.stringify(botMeta) !== JSON.stringify(browserMeta)) {
              throw new Error(path + ' Googlebot HTML differs from browser HTML: ' +
                JSON.stringify({ googlebot: botMeta, browser: browserMeta }));
            }
            const expectedMetadata = {
              '/http-headers/': { title: 'HTTP Header Analyzer — HAR Import & Security Score - DigDevBox', description: 'Import HAR or paste curl/DevTools headers. Check CSP, HSTS, cookies, CORS and indexing; get a score plus copy-ready Nginx, Vercel and Cloudflare fixes locally.', h1: 'HTTP Header Analyzer' },
              '/percentage-calculator/': { title: 'Percentage Calculator — 7 Modes - DigDevBox', description: 'Calculate percentages, discounts, percentage change, reverse percentages and percentage points. Seven modes plus batch CSV/TSV export and worked formulas.', h1: 'Percentage Calculator' },
              '/eta-calculator/': { title: 'ETA Calculator — Software Build & Task Completion - DigDevBox', description: 'Estimate when a software build, CI job, data migration or batch process will finish. Use measured progress or a known rate, compare pace with a deadline, and include buffers and weekday work hours.', h1: 'ETA Calculator' },
              '/ipv6-ula-generator/': { title: 'IPv6 ULA generator - DigDevBox', description: 'Generate RFC 4193 fd00::/8 IPv6 Unique Local Address (ULA) /48 prefixes with secure random 40-bit Global IDs or a manual Global ID. Create up to 20 prefixes and inspect first/last /64 subnets in your browser.', h1: 'IPv6 ULA generator' },
              '/api-debugger/': { title: 'REST API Tester — cURL, Tests & Collections - DigDevBox', description: 'Send REST API requests, import cURL, inspect status, headers and JSON, add assertions, and run saved collections. Requests pass through a temporary relay.', h1: 'REST API Tester' },
              '/regex-tester/': { title: 'Regular Expression Tester — JavaScript Regex - DigDevBox', description: 'Test JavaScript regular expressions online with live matches, capture groups, replacement preview and named positive/negative test cases with pass/fail results. A 300ms worker timeout stops runaway patterns.', h1: 'Regular Expression Tester' },
              '/json-prettify/': { title: 'JSON Formatter — Format, Validate & Diff - DigDevBox', description: 'Format and validate JSON online — pretty-print at your indent size, sort keys and spot syntax errors instantly, right in your browser.', h1: 'JSON Formatter' },
              '/json-workspace/': { title: 'JSON Workspace — JSONPath, Tree & Schema - DigDevBox', description: 'Format and validate JSON, inspect an interactive tree, query with JSONPath, infer JSON Schema, and convert to YAML or CSV. Free in your browser.', h1: 'JSON Workspace' },
              '/base-converter/': { title: 'Number Base Converter — Bases 2–64 - DigDevBox', description: 'Convert non-negative integers between bases 2–64, including binary, octal, decimal, hexadecimal and custom alphabets. This converts numbers, not text.', h1: 'Number Base Converter' },
              '/html-entities/': { title: 'HTML Entity Encoder & Decoder - DigDevBox', description: 'Encode and decode HTML entities for ampersands, angle brackets, quotes and apostrophes. Search named and numeric references; encoding does not sanitize HTML.', h1: 'HTML Entity Encoder & Decoder' },
              '/json-to-get-params/': { title: 'JSON to Query String Converter - DigDevBox', description: 'Percent-encode nested JSON as URL query parameters, or rebuild JSON from a query string or full URL. Supports bracketed object keys and indexed arrays.', h1: 'JSON to Query String Converter' },
              '/docker-run-to-docker-compose-converter/': { title: 'Docker Run to Compose Converter - DigDevBox', description: 'Paste a docker run command and get a docker-compose service — ports, volumes and env mapped. Free online decomposerize alternative, in your browser.', h1: 'Docker Run to Compose Converter' },
              '/otp-generator/': { title: 'TOTP Code Generator — 6-Digit Codes & QR - DigDevBox', description: 'Generate current, previous and next 6-digit TOTP codes from a Base32 secret, view the 30-second timer, and create an otpauth QR code. Uses Web Crypto.', h1: 'TOTP Code Generator' },
              '/htpasswd-generator/': { title: 'htpasswd Generator & Checker — bcrypt & apr1 - DigDevBox', description: 'Build multi-user Apache/Nginx .htpasswd files with bcrypt or apr1. Copy, download or verify a username:hash line locally. Passwords stay in your browser.', h1: 'htpasswd Generator & Checker' },
              '/safelink-decoder/': { title: 'Outlook Safe Links Batch Decoder — Reveal Original URLs - DigDevBox', description: 'Batch-decode Microsoft Outlook Safe Links one wrapper per line. Unwrap up to five layers, inspect destination scheme and host, and copy valid URLs; local parsing only, no safety scan.', h1: 'Outlook Safe Links Batch Decoder' },
              '/basic-auth-generator/': { title: 'Basic Auth Generator & Decoder — HTTP Header - DigDevBox', description: 'Generate or decode an HTTP Basic Authorization header, then copy ready-to-use cURL, Node.js and Python examples. Runs locally; use HTTPS.', h1: 'Basic Auth Generator & Decoder' },
              '/json-to-toml/': { title: 'JSON to TOML Converter - DigDevBox', description: 'Convert JSON or JSON5 objects to TOML. Nested objects become tables or dotted keys; arrays become TOML arrays. Unsupported values may prevent conversion.', h1: 'JSON to TOML Converter' },
              '/text-statistics/': { title: 'Text Statistics — Word & Character Counter - DigDevBox', description: 'Count words, characters, Unicode units, lines and UTF-8 bytes. Analyze top-term frequency and estimate reading and speaking time in your browser, with no text upload.', h1: 'Text Statistics' },
              '/json-diff/': { title: 'JSON Diff Checker — Compare JSON Online - DigDevBox', description: 'Compare JSON files or pasted JSON online. Inspect nested changes by path, export a report, and match arrays by index, ignore-order or stable ID. Large comparisons run in a cancellable worker.', h1: 'JSON Diff Checker' },
              '/slugify-string/': { title: 'URL Slug Generator — Create SEO-Friendly Slugs in Bulk - DigDevBox', description: 'Generate URL slugs from titles in bulk. Choose hyphens, underscores or dots, remove English stop words, set a word-safe length cap and preview full URLs.', h1: 'URL Slug Generator' },
              '/redirect-generator/': { title: 'Bulk 301 Redirect Generator — Apache, Nginx & Cloudflare - DigDevBox', description: 'Generate bulk redirects for Apache, Nginx, Cloudflare, Netlify and Vercel. Import CSV, detect loops and chains, and export server-ready rules locally.', h1: 'Bulk 301 Redirect Generator' },
            };
            const expected = path === '/eta-calculator/' && process.env.CHECK_ETA_RELEASE !== 'true'
              ? null
              : expectedMetadata[path];
            if (expected &&
                (botMeta.title !== expected.title ||
                 botMeta.description !== expected.description ||
                 botMeta.h1 !== expected.h1)) {
              throw new Error(path + ' production SEO metadata mismatch: ' +
                JSON.stringify({ expected, actual: botMeta }));
            }
            if (/<meta[^>]+name=["']robots["'][^>]+content=["'][^"']*noindex/i.test(bot.body)) {
              throw new Error(path + ' unexpectedly carries noindex');
            }
            const robotsHeader = bot.response.headers.get('x-robots-tag') || '';
            if (/noindex/i.test(robotsHeader)) throw new Error(path + ' unexpectedly carries X-Robots-Tag: ' + robotsHeader);
          }

          // Social cards must be route-specific raster files that work for common share crawlers.
          const socialRoutes = [
            '/',
            '/ipv6-ula-generator/',
            '/text-statistics/',
            '/eta-calculator/',
            '/guides/eta-calculator/',
            '/guides/redirect-generator/',
          ];
          const socialImageUrls = new Set();
          const extractMetaContent = (html, attribute, value) => {
            const tags = html.match(/<meta[^>]*>/gi) || [];
            const tag = tags.find(item =>
              item.includes(attribute + '="' + value + '"') || item.includes(attribute + "='" + value + "'"));
            return tag?.match(/content=["']([^"']*)["']/i)?.[1] || '';
          };
          for (const path of socialRoutes) {
            const page = await get(path);
            if (!page.response.ok || page.finalUrl !== origin + path) {
              throw new Error('Social card source page is not live at its canonical route: ' + path);
            }
            const imageUrl = extractMetaContent(page.body, 'property', 'og:image');
            const twitterImage = extractMetaContent(page.body, 'name', 'twitter:image');
            const imageType = extractMetaContent(page.body, 'property', 'og:image:type');
            const imageWidth = extractMetaContent(page.body, 'property', 'og:image:width');
            const imageHeight = extractMetaContent(page.body, 'property', 'og:image:height');
