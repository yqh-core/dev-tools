name: Temporary API Studio auth formatting

on:
  push:
    branches:
      - feat/api-studio-auth-editor-20261128
    paths:
      - 'src/pages/ApiStudio.page.vue'
      - 'src/api-studio-product/site.e2e.spec.ts'
      - 'src/tools/api-debugger/**'

permissions:
  contents: write

jobs:
  lint-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/api-studio-auth-editor-20261128
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply ESLint autofixes to the auth feature files
        run: |
          pnpm exec eslint --fix --ignore-path .gitignore \
            src/api-studio-product/site.e2e.spec.ts \
            src/pages/ApiStudio.page.vue \
            src/tools/api-debugger/backup.test.ts \
            src/tools/api-debugger/backup.ts \
            src/tools/api-debugger/collection.test.ts \
            src/tools/api-debugger/collection-tree.test.ts \
            src/tools/api-debugger/collection-tree.ts \
            src/tools/api-debugger/collection.ts \
            src/tools/api-debugger/engine.test.ts \
            src/tools/api-debugger/engine.ts \
            src/tools/api-debugger/runner.test.ts \
            src/tools/api-debugger/runner.ts
      - name: Commit formatting changes if needed
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/api-studio-product/site.e2e.spec.ts src/pages/ApiStudio.page.vue src/tools/api-debugger/
          if git diff --cached --quiet; then
            echo "No autofix changes required."
            exit 0
          fi
          git commit -m "style(api-studio): apply ESLint autofixes to auth editor"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD:feat/api-studio-auth-editor-20261128
