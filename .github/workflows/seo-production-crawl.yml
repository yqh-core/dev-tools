name: SEO production crawl audit

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"
  workflow_run:
    workflows: ["verify"]
    types: [completed]

permissions:
  contents: read
  checks: read

concurrency:
  group: seo-production-crawl
  cancel-in-progress: false

jobs:
  wait-for-deploy:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for the exact Cloudflare production deployment
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const targetSha = process.env.TARGET_SHA;
          const checksUrl = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY +
            '/commits/' + targetSha + '/check-runs';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          for (let attempt = 1; attempt <= 90; attempt++) {
            const response = await fetch(checksUrl, {
              headers: {
                authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
                accept: 'application/vnd.github+json',
                'x-github-api-version': '2022-11-28',
              },
              signal: AbortSignal.timeout(10000),
            });
            if (!response.ok) throw new Error('GitHub check-run API returned HTTP ' + response.status);
            const payload = await response.json();
            const check = (payload.check_runs || []).find((item) =>
              item.name === 'Cloudflare Pages' && item.head_sha === targetSha
            );
            if (check?.status === 'completed') {
              if (check.conclusion !== 'success') {
                throw new Error('Cloudflare Pages deployment concluded ' + check.conclusion +
                  ': ' + (check.details_url || 'no details URL'));
              }
              console.log('Cloudflare production deployment succeeded for ' + targetSha);
              process.exit(0);
            }
            console.log('Waiting for exact Cloudflare deployment (' + attempt + '/90): ' +
              (check?.status || 'check not created'));
            await sleep(10000);
          }
          throw new Error('Exact Cloudflare deployment did not complete within 15 minutes');
          NODE

  crawl:
    needs: wait-for-deploy
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main') }}
    name: "Crawl ${{ matrix.label }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: Main site
            slug: main
            url: https://www.digdevbox.com/
            max_pages: 260
          - label: DigImg
            slug: digimg
            url: https://img.digdevbox.com/
            max_pages: 160
          - label: IP Locator
            slug: ip-locator
            url: https://ip.digdevbox.com/
            max_pages: 160
          - label: StreamPlay
            slug: streamplay
            url: https://play.digdevbox.com/
            max_pages: 160
          - label: TTS Reader
            slug: tts-reader
            url: https://ttsreader.digdevbox.com/
            max_pages: 160
          - label: ImageForge
            slug: imageforge
            url: https://draw.digdevbox.com/
            max_pages: 160
          - label: Forge Notes
            slug: forge-notes
            url: https://notes.digdevbox.com/
            max_pages: 160

    steps:
      - name: Download pinned SiteOne Crawler release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/siteone" reports
          curl --fail --silent --show-error --location \
            "https://github.com/janreges/siteone-crawler/releases/download/v2.5.1/siteone-crawler-v2.5.1-linux-x64.tar.gz" \
            --output "$RUNNER_TEMP/siteone/siteone.tar.gz"
          echo "09278d958d4a087fa46093805cd33b085b96618001dd31d45c448ad724c9024e  $RUNNER_TEMP/siteone/siteone.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/siteone/siteone.tar.gz" -C "$RUNNER_TEMP/siteone"
          BIN="$(find "$RUNNER_TEMP/siteone" -type f -name siteone-crawler -print -quit)"
          test -n "$BIN"
          chmod +x "$BIN"
          echo "SiteOne Crawler v2.5.1 verified by pinned SHA-256"
          echo "SITEONE_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Crawl production site politely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          set +e
          "$SITEONE_BIN" \
            --url="${{ matrix.url }}" \
            --device=mobile \
            --workers=1 \
            --max-reqs-per-sec=1 \
            --timeout=20 \
            --max-depth=4 \
            --max-queue-length=600 \
            --max-visited-urls="${{ matrix.max_pages }}" \
            --output=text \
            --output-json-file="reports/${{ matrix.slug }}.json" \
            --output-html-report="reports/${{ matrix.slug }}.html" \
            --html-report-options="summary,seo-opengraph,visited-urls,security,redirects,404-pages,headers,best-practices,accessibility"
          code=$?
          set -e
          echo "$code" > "reports/${{ matrix.slug }}.exit-code.txt"
          if [ "$code" -ne 0 ]; then
            echo "::error::SiteOne crawler failed at runtime for ${{ matrix.label }} (exit $code)"
            exit "$code"
          fi

      - name: Upload crawl evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-crawl-${{ matrix.slug }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
