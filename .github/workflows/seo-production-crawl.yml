name: SEO production crawl audit

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/seo-production-crawl.yml"
      - "src/seo/**"
      - "src/components/**"
      - "src/pages/**"
      - "src/layouts/**"
      - "src/App.vue"
      - "src/content/legal/**"
      - "locales/en.yml"
      - "scripts/check-internal-canonical-links.mjs"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: seo-production-crawl
  cancel-in-progress: false

jobs:
  crawl:
    name: "Crawl ${{ matrix.label }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: Main site
            slug: main
            url: https://www.digdevbox.com/
            max_pages: 260
          - label: DigImg
            slug: digimg
            url: https://img.digdevbox.com/
            max_pages: 160
          - label: IP Locator
            slug: ip-locator
            url: https://ip.digdevbox.com/
            max_pages: 160
          - label: StreamPlay
            slug: streamplay
            url: https://play.digdevbox.com/
            max_pages: 160
          - label: TTS Reader
            slug: tts-reader
            url: https://ttsreader.digdevbox.com/
            max_pages: 160
          - label: ImageForge
            slug: imageforge
            url: https://draw.digdevbox.com/
            max_pages: 160
          - label: Forge Notes
            slug: forge-notes
            url: https://notes.digdevbox.com/
            max_pages: 160

    steps:
      - name: Download pinned SiteOne Crawler release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/siteone" reports
          curl --fail --silent --show-error --location \
            "https://github.com/janreges/siteone-crawler/releases/download/v2.5.1/siteone-crawler-v2.5.1-linux-x64.tar.gz" \
            --output "$RUNNER_TEMP/siteone/siteone.tar.gz"
          echo "09278d958d4a087fa46093805cd33b085b96618001dd31d45c448ad724c9024e  $RUNNER_TEMP/siteone/siteone.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/siteone/siteone.tar.gz" -C "$RUNNER_TEMP/siteone"
          BIN="$(find "$RUNNER_TEMP/siteone" -type f -name siteone-crawler -print -quit)"
          test -n "$BIN"
          chmod +x "$BIN"
          echo "SiteOne Crawler v2.5.1 verified by pinned SHA-256"
          echo "SITEONE_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Crawl production site politely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          set +e
          "$SITEONE_BIN" \
            --url="${{ matrix.url }}" \
            --device=mobile \
            --workers=1 \
            --max-reqs-per-sec=1 \
            --timeout=20 \
            --max-depth=4 \
            --max-queue-length=600 \
            --max-visited-urls="${{ matrix.max_pages }}" \
            --output=text \
            --output-json-file="reports/${{ matrix.slug }}.json" \
            --output-html-report="reports/${{ matrix.slug }}.html" \
            --html-report-options="summary,seo-opengraph,visited-urls,security,redirects,404-pages,headers,best-practices,accessibility"
          code=$?
          set -e
          echo "$code" > "reports/${{ matrix.slug }}.exit-code.txt"
          if [ "$code" -ne 0 ]; then
            echo "::error::SiteOne crawler failed at runtime for ${{ matrix.label }} (exit $code)"
            exit "$code"
          fi

      - name: Upload crawl evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-crawl-${{ matrix.slug }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
