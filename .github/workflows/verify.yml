name: verify

# 只做质量门禁，不负责发布。
# 发布由 Cloudflare Pages 的 Git 集成负责（push main 即自动构建上线）。
# 两条链路职责不重叠 —— Actions 答"能不能发"，Cloudflare 答"发"。
#
# 这里刻意复刻 Cloudflare 侧的构建环境：node 22.16.0（v3 镜像默认值，来自 .nvmrc）
# + pnpm 9.11.0（与 package.json 的 packageManager 一致）。
# 本地能过、这里能过，Cloudflare 那边才有把握过。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 仓库转私有后 runner 规格从 4 核/16GB 降到 2 核/7GB（公共仓库才免费给大规格），
    # Node 默认堆上限不够跑完 vue-tsc + vite 构建，实测在 2GB 附近 OOM（exit 134）。
    # 显式放宽到 4GB，给系统和其余进程留余量。
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查 + 构建
        run: pnpm run build

      - name: 校验产物
        run: |
          set -euo pipefail

          test -f dist/index.html || { echo "::error::dist/index.html 缺失"; exit 1; }

          # SPA 路由回退规则丢失的话，直接访问 /json-diff 这类深链会 404
          test -f dist/_redirects || { echo "::error::dist/_redirects 缺失（SPA 回退规则没进产物）"; exit 1; }

          # 源码 / 依赖不该被打进发布目录
          for d in node_modules src scripts; do
            if [ -e "dist/$d" ]; then
              echo "::error::dist/$d 不该出现在发布产物里"
              exit 1
            fi
          done

          echo "产物文件数: $(find dist -type f | wc -l)"
          du -sh dist

      # 这一步是便利项，不是门禁。
      # 实测 GitHub 的 artifacts 后端会偶发失败：
      #   ##[error]Failed to FinalizeArtifact: Received non-retryable error:
      #   Failed request: (403) Forbidden: Error from intermediary
      # 产物内容其实已上传成功，卡在最后的 Finalize 阶段；配额也正常
      # （全账号 artifacts 合计仅约 12 MiB），同一步骤在其他仓库能成功。
      # 这种后端抖动不该把仓库标红。真门禁是上面那两步。
      - name: 上传产物（便于人工核对）
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
