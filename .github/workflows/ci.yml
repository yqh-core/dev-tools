name: ci

# 质量门禁：lint / 单测 / 类型检查 / 构建。
# 与 verify.yml 的分工：verify.yml 复刻 Cloudflare 的构建环境做「能不能发布」的判定，
# ci.yml 做代码质量检查。两者都不负责发布 —— 发布由 Cloudflare Pages Git 集成完成。
#
# 相对上游的改动：
# - Node 20 → .nvmrc（22.16.0，与 Cloudflare Pages v3 构建镜像默认值一致）
# - corepack enable → pnpm/action-setup@v4 钉死 9.11.0（与 package.json 的
#   packageManager 字段一致）。corepack enable 会临时去网络取包，属多余的不确定性。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # 同 verify.yml：私有仓库的 runner 只有 2 核/7GB，构建需显式放宽 Node 堆上限。
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Lint API relay and Durable Object Worker
        run: pnpm run lint:relay-limiter

      - name: 单元测试
        run: pnpm run test

      - name: 类型检查
        run: pnpm run typecheck

      - name: 构建
        run: pnpm run build

      # Focused browser checks cover pages with measurable search exposure and
      # the key usage explanations added for those intents.
      - name: Install Chromium for targeted E2E
        run: pnpm exec playwright install chromium

      - name: E2E — JSON Diff, percentage, numeronym, ETA, IPv6 ULA, text statistics, HTTP Headers, Slugify, Basic Auth and Safe Links
        run: >-
          pnpm exec playwright test
          src/tools/json-diff/json-diff.e2e.spec.ts
          src/tools/percentage-calculator/percentage-calculator.e2e.spec.ts
          src/tools/numeronym-generator/numeronym-generator.e2e.spec.ts
          src/tools/eta-calculator/eta-calculator.e2e.spec.ts
          src/tools/ipv6-ula-generator/ipv6-ula-generator.e2e.spec.ts
          src/tools/text-statistics/text-statistics.e2e.spec.ts
          src/tools/http-headers/http-headers.e2e.spec.ts
          src/tools/slugify-string/slugify-string.e2e.spec.ts
          src/tools/redirect-generator/redirect-generator.e2e.spec.ts
          src/tools/basic-auth-generator/basic-auth-generator.e2e.spec.ts
          src/tools/htpasswd-generator/htpasswd-generator.e2e.spec.ts
          src/tools/regex-tester/regex-tester.e2e.spec.ts
          src/tools/safelink-decoder/safelink-decoder.e2e.spec.ts
          src/pages/home-task-discovery.e2e.spec.ts
          src/pages/homepage-visual-baseline.e2e.spec.ts
          src/tools/api-debugger/api-studio.e2e.ts
          --project=chromium

      - name: Upload homepage visual baseline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-first-fold-${{ github.sha }}
          path: artifacts/homepage-visual/
          if-no-files-found: warn
          retention-days: 3
