name: E2E tests

# 相对上游的改动（两处，都是修 bug 或降噪，不改变测试内容）：
#
# 1. 触发方式：上游在每次 push main / pull_request 都跑，3 个分片各下载一遍
#    Playwright 浏览器 + 系统依赖，成本高且对个人仓库意义有限。
#    改为手动触发，需要时在 Actions 页面 Run workflow 即可。
#
# 2. 取版本号的命令写错了对象：上游读的是 .dependencies.playwright，
#    但仓库里的依赖键是 devDependencies["@playwright/test"]，取值恒为 null，
#    导致 cache key 恒为 ...-playwright-null-...，浏览器缓存实际从未命中。
on:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Get Playwright version
        id: playwright-version
        run: |
          echo "PLAYWRIGHT_VERSION=$(jq -r '.devDependencies["@playwright/test"] // .dependencies["@playwright/test"]' package.json)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm run build

      - name: Restore Playwright browsers from cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}-${{ hashFiles('**/playwright.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}-
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm run test:e2e --shard=${{ matrix.shard }}
