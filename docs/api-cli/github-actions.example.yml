# GitHub Actions 示例：API Studio CLI 数据驱动 CI（任务书 §8 C4）

```yaml
name: api-tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) 安装：本仓库自研 CLI（自举构建；零新增运行时依赖）
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/build-cli.mjs          # → dist-cli/api-studio-cli.mjs

      # 2) 读取 Collection（仓库内；亦可改用 actions/upload/download-artifact 传递）
      #    集合文件：./collections/smoke.json（Postman v2.1）

      # 3) 从 CI Secrets 注入凭据——生成临时环境文件（不硬编码 Secret，日志不打印值）
      - run: |
          node -e "const fs=require('fs');fs.writeFileSync('ci-env.json',JSON.stringify({name:'ci',values:[{key:'baseUrl',value:process.env.API_BASE_URL,enabled:true},{key:'token',value:process.env.API_TOKEN,enabled:true,secret:true}]}))"
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}

      # 4) 执行数据驱动测试（Newman 常见参数兼容：-d 数据文件 -n 轮数 --bail）
      - run: |
          node dist-cli/api-studio-cli.mjs run ./collections/smoke.json \
            --environment ci-env.json \
            --iteration-data ./data/users.csv \
            -n 3 \
            --reporters cli,json,junit \
            --report-json ./reports/run.json \
            --report-junit ./reports/junit.xml \
            --ci

      # 5) 上传报告 Artifact（无论成败保留证据）
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-studio-reports
          path: |
            reports/run.json
            reports/junit.xml

      # 6) 退出码传播：断言失败/格式错误/超时/写失败 → 非零 → Job 红（第 4 步 run 已传播）
```

## C4 硬要求落实核对

- **CI 不硬编码 Secret**：凭据只经 `secrets.*` → 环境文件 → CLI；环境文件不进仓库（示例为每 run 生成临时文件）。
- **日志不泄露**：CLI 报告引擎默认排除 Secret/Authorization/Cookie/API Key/环境变量值/数据行值/请求响应体/响应头值（JSON/JUnit/stdout 三面同口径）；进度只打方法/状态/耗时。
- **未配置 Secret 时安全失败**：`ci-env.json` 生成缺 API_TOKEN 时，集合内 `{{token}}` 未解析 → Missing variables fail-closed（退出码 2，作业红），**不偷退任何生产凭据**；或使用非敏感示例环境（值仅指向公开测试 stub）。
- **测试失败使 Job 非零退出**：CLI 退出码契约 0/1/2/3/4 全非零即红（第 4 步 `run` 直接传播）。
- **真实 CI 运行**：本示例随 C 批次交付；在本仓库推送 CI（main 保护）需 yqh 授权——未授权前按任务书 §10.2 标注 NOT RUN（授权后补真实 CI 日志与 Artifact 回执）。
