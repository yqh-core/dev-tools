<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8" />
      <!-- Always use root-absolute paths: a relative path would resolve under a sub-path
           such as /token-generator/ into /token-generator/favicon.ico, causing one
           pointless 404 per page across the whole site. -->
      <link rel="icon" href="/favicon.ico" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      <!-- page-seo:start — the tags below vary per page and are replaced wholesale at build
           time by scripts/build-seo.mjs. The values here are only used by `vite dev`
           (before prerendering). Add new page-level SEO tags inside this block, never
           outside it — otherwise they will not be replaced during prerendering and will
           contradict the actual page content. -->
      <title>DigDevBox - Online Developer Tools</title>
      <link rel="canonical" href="https://digdevbox.com/" />
      <meta itemprop="name" content="DigDevBox - Online Developer Tools" />
      <meta
              name="description"
              content="A curated collection of practical online tools for developers and IT professionals, with a friendly interface and simple workflows. DigDevBox is a free and open-source toolkit covering encryption, conversion, development, networking and more."
      />
      <meta
              itemprop="description"
              content="A curated collection of practical online tools for developers and IT professionals, with a friendly interface and simple workflows. DigDevBox is a free and open-source toolkit covering encryption, conversion, development, networking and more."
      />

      <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
      <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
      <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
      <link rel="mask-icon" href="safari-pinned-tab.svg" color="#0f766e" />
      <meta name="msapplication-TileColor" content="#0f766e" />
      <meta name="theme-color" content="#0f766e" />

      <meta property="og:url" content="https://digdevbox.com/" />
      <meta property="og:type" content="website" />
      <meta property="og:title" content="DigDevBox - Online Developer Tools" />
      <meta
              property="og:description"
              content="A curated collection of practical online tools for developers and IT professionals, with a friendly interface and simple workflows. DigDevBox is a free and open-source toolkit covering encryption, conversion, development, networking and more."
      />
      <meta property="og:image" content="https://digdevbox.com/og-image.jpg?v=3" />

      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" content="DigDevBox - Online Developer Tools" />
      <meta
              name="twitter:description"
              content="A curated collection of practical online tools for developers and IT professionals, with a friendly interface and simple workflows. DigDevBox is a free and open-source toolkit covering encryption, conversion, development, networking and more."
      />
      <meta name="twitter:image" content="https://digdevbox.com/og-image.jpg?v=3" />
      <meta name="twitter:image:alt" content="DigDevBox - Online Developer Tools" />
      <!-- page-seo:end -->
  
  <link rel="stylesheet" href="/css/dd-tokens.css">
  <link rel="stylesheet" href="/css/dd-shell.css">
  
<!-- adsense:start -->
  <meta name="google-adsense-account" content="ca-pub-7944759654100814" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7944759654100814" crossorigin="anonymous"></script>
      <!-- adsense:end -->

      <!-- 站点级结构化数据：WebSite + Organization。放在 page-seo 区块**外**，
           因此预渲染逐页替换时原样保留 —— 每个页面（含 101 个工具页）都带这份
           站点级声明。页面级的 SoftwareApplication 由 scripts/build-seo.mjs
           按工具注入，不在这里写死。 -->
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://digdevbox.com/#website",
            "url": "https://digdevbox.com/",
            "name": "DigDevBox",
            "alternateName": "DigDevBox - Online Developer Tools",
            "description": "A curated collection of practical online tools for developers and IT professionals, running locally in the browser.",
            "inLanguage": "en"
          },
          {
            "@type": "Organization",
            "@id": "https://digdevbox.com/#organization",
            "name": "DigDevBox",
            "url": "https://digdevbox.com/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://digdevbox.com/og-image.jpg"
            }
          }
        ]
      }
      </script>
</head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
